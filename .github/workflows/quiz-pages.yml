# Publishes the quiz/ folder to GitHub Pages on every push that changes it.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Published at https://algoga22.github.io/Focus-Activity-Training3/ (trainer screen: host.html)
name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['quiz/**', '.github/workflows/quiz-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quiz
      - id: deployment
        uses: actions/deploy-pages@v4
